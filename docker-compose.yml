services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
      POSTGRES_DB: patterns
    ports:
      - '55434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patterns']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '56381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
