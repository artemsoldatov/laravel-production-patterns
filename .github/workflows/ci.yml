name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patterns
          POSTGRES_PASSWORD: patterns
          POSTGRES_DB: patterns
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U patterns"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pcntl, bcmath, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (formatting)
        run: ./vendor/bin/pint --test

      - name: PHPStan (max)
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        run: php artisan migrate --force

      - name: Tests (Pest, real Postgres + Redis)
        run: ./vendor/bin/pest
